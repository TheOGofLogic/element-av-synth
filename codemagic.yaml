workflows:
  element-av-synth-appstore:
    name: Element AV Synth v1.0 (Build 1) — App Store & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: ChemicalSoundASC
    environment:
      vars:
        BUNDLE_ID: "com.geraldclerge.elementavsynth"
        XCODE_PROJECT: "ios/ElementAVSynth.xcodeproj"
        XCODE_SCHEME: "ElementAVSynth"
    scripts:
      - name: Run Swift Package Unit Tests
        script: |
          set -euo pipefail
          swift test

      - name: Generate Xcode project, provision Apple signing files & apply profiles
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          (cd ios && xcodegen generate)
          keychain initialize
          openssl genrsa -out /tmp/dist_cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/dist_cert_key.pem
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build signed IPA for App Store Connect & TestFlight
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
