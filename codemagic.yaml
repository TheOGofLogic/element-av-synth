workflows:
  ios-testflight:
    name: Element AV Synth — TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: ChemicalSoundASC
    environment:
      xcode: 16.4
      groups:
        - ios_creds
      vars:
        BUNDLE_ID: "com.geraldclerge.elementavsynth"
        XCODE_PROJECT: "ios/ElementAVSynth.xcodeproj"
        XCODE_SCHEME: "ElementAVSynth"
    scripts:
      - name: Run ElementAVCore XCTest Suite
        script: |
          set -euo pipefail
          swift test

      - name: Generate Xcode project, set build number & provision signing
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          BUILD_NUM="${PROJECT_BUILD_NUMBER:-1}"
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: ${BUILD_NUM}/" ios/project.yml
          (cd ios && xcodegen generate)

          keychain initialize
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > /tmp/dist_cert_key.pem
          else
            openssl genrsa -out /tmp/dist_cert_key.pem 2048
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/dist_cert_key.pem
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build & Package Signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
          ls -la build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
