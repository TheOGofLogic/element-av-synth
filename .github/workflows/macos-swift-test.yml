name: macOS Swift XCTest & Unsigned iOS Build (Element AV Synth)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  macos-build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print Toolchain Versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run ElementAVCore XCTest Suite
        run: |
          set -euo pipefail
          swift test 2>&1 | tee swift_test_output.txt

      - name: Generate Xcode Project & Build Unsigned iOS App
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          (cd ios && xcodegen generate)
          xcodebuild \
            -project ios/ElementAVSynth.xcodeproj \
            -scheme ElementAVSynth \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            clean build
