name: ElementAVSynth
options:
  bundleIdPrefix: com.geraldclerge
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

targets:
  ElementAVSynth:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/ElementAVCore
      - path: ../App/ElementAVSynthApp.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Element AV Synth
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSBluetoothAlwaysUsageDescription: "Element AV Synth uses Bluetooth Low Energy to discover and send 8-byte spectral color and pulse-timing packets to compatible external LED controllers (such as ESP32 or Nordic nRF52 receivers)."
        NSBluetoothPeripheralUsageDescription: "Element AV Synth connects to external BLE LED light controllers to mirror atomic emission spectra."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geraldclerge.elementavsynth
        DEVELOPMENT_TEAM: M9Z3LR6VA2
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  ElementAVSynth:
    build:
      targets:
        ElementAVSynth: all
    archive:
      config: Release
